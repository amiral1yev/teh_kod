name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать сканирование вручную

jobs:
  analyze:
    name: Analyze C code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'c-cpp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality # Включаем расширенный поиск уязвимостей

    - name: Manual Build C files
      run: |
        # Вручную компилируем каждый .c файл в объектный файл, чтобы CodeQL увидел процесс
        for file in *.c; do
          gcc -c "$file" -o "${file%.c}.o"
        done

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
